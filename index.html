<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dragonforge — BDH Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🐉</div>
    <div>
      <div class="brand-line">
        <h1>DRAGONFORGE</h1>
        <span class="badge green">BDH</span>
        <span class="badge">25.3M PARAMS</span>
      </div>
      <p>Neural pathway microscope · activation analysis environment</p>
    </div>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    <span id="statusText">INFERENCE READY</span>
  </div>
</header>

<section class="probe">
  <div class="probe-label">INPUT PROMPT</div>

  <div class="input-row">
    <div class="input-box">
      <span>⌕</span>
      <input id="probeText" type="text" readonly>
    </div>
  </div>

  <div class="preset-row" id="presetRow"></div>
</section>

<section class="summary" id="summary"></section>

<nav class="tabs">
  <button class="tab active" data-view="pipeline">01 <span>Pipeline</span></button>
  <button class="tab" data-view="sparsity">02 <span>Sparsity</span></button>
  <button class="tab" data-view="activations">03 <span>Activations</span></button>
  <button class="tab" data-view="attention">04 <span>Attention</span></button>
  <button class="tab" data-view="rope">05 <span>RoPE</span></button>
</nav>

<div class="workspace">

  <aside class="sidebar">
    <div class="sidebar-head">
      <div>
        <span class="eyebrow">MODEL EXPLORER</span>
        <strong>Layer Pipeline</strong>
      </div>
      <span class="count" id="layerCount"></span>
    </div>

    <div class="layer-tree" id="layerTree"></div>
  </aside>

  <main class="content">
    <div id="vizContainer"></div>
  </main>

</div>

<script src="data.js"></script>

<script>
(function () {
  let currentInput = 0;
  let currentView = "pipeline";
  let selectedLayer = 0;

  const data = typeof BDH_DATA !== "undefined" ? BDH_DATA : null;

  if (!data || !data.inputs || !data.inputs.length) {
    document.body.innerHTML = '<div class="fatal">BDH_DATA could not be loaded.</div>';
    return;
  }

  const $ = id => document.getElementById(id);

  function inputData() {
    return data.inputs[currentInput];
  }

  function captures() {
    return inputData().captures || [];
  }

  function pct(value) {
    return ((Number(value) || 0) * 100).toFixed(1) + "%";
  }

  function number(value) {
    if (value === undefined || value === null) return "—";
    if (Math.abs(value) >= 1000) return Number(value).toLocaleString();
    return Number(value).toFixed(3);
  }

  function shape(shape) {
    return "[" + (shape || []).join(" × ") + "]";
  }

  function active(value) {
    return 1 - (Number(value) || 0);
  }

  function renderPresets() {
    const row = $("presetRow");
    row.innerHTML = "";

    data.inputs.forEach((item, index) => {
      const button = document.createElement("button");
      button.className = "preset" + (index === currentInput ? " active" : "");
      button.textContent = '"' + item.text + '"';

      button.onclick = function () {
        currentInput = index;
        selectedLayer = 0;
        update();
      };

      row.appendChild(button);
    });
  }

  function renderSummary() {
    const item = inputData();
    const list = captures();

    const avgSparsity = list.length
      ? list.reduce((sum, capture) => sum + (capture.output.sparsity || 0), 0) / list.length
      : 0;

    const avgActive = 1 - avgSparsity;

    $("summary").innerHTML = `
      <div class="metric">
        <span>TOKENS</span>
        <strong>${item.token_count}</strong>
      </div>
      <div class="metric">
        <span>LAYERS</span>
        <strong>${list.length}</strong>
      </div>
      <div class="metric">
        <span>AVG SPARSITY</span>
        <strong>${pct(avgSparsity)}</strong>
      </div>
      <div class="metric">
        <span>ACTIVE</span>
        <strong>${pct(avgActive)}</strong>
      </div>
      <div class="metric">
        <span>PARAMETERS</span>
        <strong>${(data.total_params / 1000000).toFixed(1)}M</strong>
      </div>
      <div class="metric ready">
        <span>STATUS</span>
        <strong>READY</strong>
      </div>
    `;
  }

  function renderTree() {
    const tree = $("layerTree");
    const list = captures();

    $("layerCount").textContent = list.length + " LAYERS";

    tree.innerHTML = "";

    list.forEach((capture, index) => {
      const output = capture.output;
      const item = document.createElement("button");

      item.className = "layer-item" + (selectedLayer === index ? " selected" : "");

      item.onclick = function () {
        selectedLayer = index;
        renderTree();

        if (currentView === "pipeline") {
          renderPipeline();
        } else if (currentView === "sparsity") {
          renderSparsity();
        } else if (currentView === "activations") {
          renderActivationDetail();
        }
      };

      item.innerHTML = `
        <span class="layer-dot ${capture.module_path}"></span>

        <span class="layer-info">
          <strong>${capture.module_path.toUpperCase()}</strong>
          <small>${capture.type}</small>
          <small>${shape(output.shape)}</small>

          <span class="mini-meter">
            <i style="width:${active(output.sparsity) * 100}%"></i>
          </span>
        </span>

        <span class="layer-percent">
          ${pct(output.sparsity)}
        </span>
      `;

      tree.appendChild(item);
    });
  }

  function renderPipeline() {
    const list = captures();

    $("vizContainer").innerHTML = `
      <section class="view">
        <div class="view-head">
          <div>
            <span class="eyebrow">01 · PATHWAY</span>
            <h2>Inference Pipeline</h2>
            <p>Follow the representation through every captured stage.</p>
          </div>
        </div>

        <div class="pipeline">
          ${list.map((capture, index) => {
            const output = capture.output;
            const density = active(output.sparsity);

            return `
              <button class="pipeline-node ${selectedLayer === index ? "selected" : ""}" onclick="window.selectLayer(${index})">
                <div class="node-number">${String(index + 1).padStart(2, "0")}</div>

                <div class="node-main">
                  <div class="node-title">${capture.module_path.toUpperCase()}</div>
                  <div class="node-type">${capture.type}</div>

                  <div class="node-shape">${shape(output.shape)}</div>

                  <div class="node-stats">
                    <span>ACTIVE <b>${pct(density)}</b></span>
                    <span>SPARSE <b>${pct(output.sparsity)}</b></span>
                    <span>ELEMENTS <b>${output.numel.toLocaleString()}</b></span>
                  </div>

                  <div class="meter">
                    <i style="width:${density * 100}%"></i>
                  </div>
                </div>
              </button>

              ${index < list.length - 1 ? '<div class="flow-arrow">↓</div>' : ""}
            `;
          }).join("")}
        </div>
      </section>
    `;
  }

  function renderSparsity() {
    const list = captures();

    const average = list.reduce(
      (sum, capture) => sum + (capture.output.sparsity || 0),
      0
    ) / list.length;

    const peak = Math.max(
      ...list.map(capture => capture.output.sparsity || 0)
    );

    const capture = list[selectedLayer];
    const output = capture.output;

    $("vizContainer").innerHTML = `
      <section class="view">
        <div class="view-head">
          <div>
            <span class="eyebrow">02 · SPARSITY</span>
            <h2>Sparsity Analysis</h2>
            <p>Measure how much computation is inactive across the pathway.</p>
          </div>
        </div>

        <div class="stat-grid">
          <div class="big-stat">
            <span>AVERAGE SPARSITY</span>
            <strong>${pct(average)}</strong>
          </div>

          <div class="big-stat">
            <span>ACTIVE COMPUTATION</span>
            <strong>${pct(1 - average)}</strong>
          </div>

          <div class="big-stat">
            <span>PEAK SPARSITY</span>
            <strong>${pct(peak)}</strong>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <span>LAYER SPARSITY</span>
            <small>0% = dense · 100% = inactive</small>
          </div>

          <div class="bar-chart">
            ${list.map((item, index) => {
              const value = item.output.sparsity || 0;

              return `
                <button class="bar-row ${selectedLayer === index ? "selected" : ""}" onclick="window.selectLayer(${index})">
                  <span class="bar-name">${item.module_path.toUpperCase()}</span>

                  <span class="bar-track">
                    <i style="width:${value * 100}%"></i>
                  </span>

                  <strong>${pct(value)}</strong>
                </button>
              `;
            }).join("")}
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <span>INFERENCE TRACE</span>
            <small>signal activity</small>
          </div>

          <div class="trace">
            ${list.map((item, index) => `
              <button onclick="window.selectLayer(${index})" class="${selectedLayer === index ? "selected" : ""}">
                <span>${item.module_path.toUpperCase()}</span>
                <b>${pct(active(item.output.sparsity))}</b>
              </button>
              ${index < list.length - 1 ? '<i>→</i>' : ""}
            `).join("")}
          </div>
        </div>

        <div class="card selected-card">
          <div class="card-head">
            <span>SELECTED LAYER</span>
            <small>${capture.type}</small>
          </div>

          <div class="selected-title">${capture.module_path.toUpperCase()}</div>

          <div class="detail-grid">
            <div><span>SHAPE</span><strong>${shape(output.shape)}</strong></div>
            <div><span>ELEMENTS</span><strong>${output.numel.toLocaleString()}</strong></div>
            <div><span>MEAN</span><strong>${number(output.mean)}</strong></div>
            <div><span>STD</span><strong>${number(output.std)}</strong></div>
            <div><span>MIN</span><strong>${number(output.min)}</strong></div>
            <div><span>MAX</span><strong>${number(output.max)}</strong></div>
            <div><span>SPARSITY</span><strong>${pct(output.sparsity)}</strong></div>
            <div><span>ACTIVE</span><strong>${pct(active(output.sparsity))}</strong></div>
          </div>
        </div>
      </section>
    `;
  }

  function renderActivations() {
    const list = captures();

    $("vizContainer").innerHTML = `
      <section class="view">
        <div class="view-head">
          <div>
            <span class="eyebrow">03 · TENSOR INSPECTOR</span>
            <h2>Activations</h2>
            <p>Inspect the statistical profile of each captured tensor.</p>
          </div>

          <select id="activationSelect" class="select">
            ${list.map((capture, index) => `
              <option value="${index}" ${selectedLayer === index ? "selected" : ""}>
                ${capture.module_path.toUpperCase()}
              </option>
            `).join("")}
          </select>
        </div>

        <div id="activationDetail"></div>
      </section>
    `;

    $("activationSelect").onchange = function () {
      selectedLayer = Number(this.value);
      renderTree();
      renderActivationDetail();
    };

    renderActivationDetail();
  }

  function renderActivationDetail() {
    const capture = captures()[selectedLayer];
    if (!capture) return;

    const output = capture.output;
    const sample = output.sample || [];

    $("activationDetail").innerHTML = `
      <div class="tensor-head">
        <div>
          <span class="eyebrow">ACTIVATION TENSOR</span>
          <h3>${capture.module_path.toUpperCase()}</h3>
          <span>${capture.type}</span>
        </div>

        <code>${shape(output.shape)}</code>
      </div>

      <div class="stat-grid activation-stats">
        <div class="big-stat"><span>MEAN</span><strong>${number(output.mean)}</strong></div>
        <div class="big-stat"><span>STD</span><strong>${number(output.std)}</strong></div>
        <div class="big-stat"><span>MIN</span><strong>${number(output.min)}</strong></div>
        <div class="big-stat"><span>MAX</span><strong>${number(output.max)}</strong></div>
        <div class="big-stat"><span>SPARSITY</span><strong>${pct(output.sparsity)}</strong></div>
        <div class="big-stat"><span>ELEMENTS</span><strong>${output.numel.toLocaleString()}</strong></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span>ACTIVATION SAMPLE</span>
          <small>${sample.length} captured values</small>
        </div>

        <div class="activation-chart">
          ${sample.map((value, index) => {
            const max = Math.max(
              Math.abs(output.min || 1),
              Math.abs(output.max || 1)
            );

            const height = Math.max(
              3,
              Math.min(100, Math.abs(value) / max * 100)
            );

            return `
              <div
                class="activation-column"
                style="height:${height}%"
                title="index ${index}: ${value}"
              ></div>
            `;
          }).join("")}
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <span>RAW SAMPLE</span>
          <small>captured tensor values</small>
        </div>

        <div class="value-grid">
          ${sample.map((value, index) => `
            <div>
              <small>${index}</small>
              <strong>${Number(value).toFixed(3)}</strong>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  function renderAttention() {
    $("vizContainer").innerHTML = `
      <section class="view">
        <div class="view-head">
          <div>
            <span class="eyebrow">04 · ATTENTION</span>
            <h2>Attention Analysis</h2>
            <p>Inspect token-to-token attention when raw attention weights are available.</p>
          </div>
        </div>

        <div class="unavailable">
          <div class="unavailable-icon">∿</div>
          <span class="eyebrow">RAW ATTENTION TENSOR NOT CAPTURED</span>
          <h3>Attention heatmaps are not available yet.</h3>
          <p>
            The current Dragonforge capture contains attention output activations,
            but it does not expose the raw Q·Kᵀ attention matrix.
          </p>

          <div class="tensor-required">
            <span>REQUIRED</span>
            <code>[heads, sequence, sequence]</code>
          </div>
        </div>

        <div class="card roadmap">
          <div class="card-head">
            <span>AVAILABLE DATA</span>
          </div>

          <div class="availability">
            <div class="available">✓ Attention output activation</div>
            <div class="unavailable-line">○ Raw Q·Kᵀ scores</div>
            <div class="unavailable-line">○ Per-head attention matrix</div>
            <div class="unavailable-line">○ Token relationship map</div>
          </div>
        </div>
      </section>
    `;
  }

  function renderRope() {
    $("vizContainer").innerHTML = `
      <section class="view">
        <div class="view-head">
          <div>
            <span class="eyebrow">05 · POSITIONAL ENCODING</span>
            <h2>RoPE</h2>
            <p>Inspect rotary positional information when the frequency tensors are captured.</p>
          </div>
        </div>

        <div class="unavailable">
          <div class="unavailable-icon">⊞</div>
          <span class="eyebrow">ROPE TENSORS NOT CAPTURED</span>
          <h3>Rotary phase visualization is not available yet.</h3>
          <p>
            The current data contains the output of the attention pathway,
            but not the frequency buffers required to reconstruct the rotary phase.
          </p>

          <div class="tensor-required">
            <span>REQUIRED</span>
            <code>inv_freq · cos_cached · sin_cached</code>
          </div>
        </div>

        <div class="card roadmap">
          <div class="card-head">
            <span>AVAILABLE DATA</span>
          </div>

          <div class="availability">
            <div class="available">✓ Attention output activation</div>
            <div class="unavailable-line">○ RoPE frequencies</div>
            <div class="unavailable-line">○ Position phase</div>
            <div class="unavailable-line">○ Rotation vectors</div>
          </div>
        </div>
      </section>
    `;
  }

  function render() {
    if (currentView === "pipeline") renderPipeline();
    if (currentView === "sparsity") renderSparsity();
    if (currentView === "activations") renderActivations();
    if (currentView === "attention") renderAttention();
    if (currentView === "rope") renderRope();
  }

  function update() {
    $("probeText").value = inputData().text;

    renderPresets();
    renderSummary();
    renderTree();
    render();
  }

  window.selectLayer = function (index) {
    selectedLayer = index;
    renderTree();

    if (currentView === "pipeline") renderPipeline();
    if (currentView === "sparsity") renderSparsity();
    if (currentView === "activations") renderActivations();
  };

  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", function () {
      currentView = this.dataset.view;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      this.classList.add("active");

      render();
    });
  });

  update();
})();
</script>

</body>
</html>
